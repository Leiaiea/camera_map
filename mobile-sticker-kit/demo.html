<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Mobile Sticker Kit demo</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; font: 15px system-ui,sans-serif; color: #37453d; background: #edf1e9; }
    main { max-width: 480px; min-height: 100dvh; margin: auto; padding: 24px 18px; display: grid; gap: 18px; align-content: center; }
    #map { position: relative; min-height: 420px; overflow: hidden; border-radius: 28px; background: #d9e4d8; box-shadow: inset 0 0 0 1px #fff9; }
    #map::before { content: "我的地图"; position: absolute; top: 22px; left: 24px; color: #899788; letter-spacing: .2em; }
    #map::after { content: ""; position: absolute; inset: 25% -20%; border: 18px solid #f7f3e8; border-radius: 50%; transform: rotate(-18deg); }
    .controls { display: grid; gap: 10px; } button, label { min-height: 48px; border: 0; border-radius: 24px; padding: 12px 18px; text-align: center; background: #ffffff; color: inherit; cursor: pointer; }
    button { background: #536c5c; color: #fff; } button:disabled { opacity: .55; } input { display: none; } #status { min-height: 1.2em; text-align: center; color: #6d786d; }
  </style>
  <main>
    <div id="map" aria-label="地图画布"></div>
    <div class="controls">
      <label>选择照片<input id="file" type="file" accept="image/*" capture="environment"></label>
      <button id="add" disabled>抠图并贴到地图</button>
      <div id="status" role="status"></div>
    </div>
  </main>
  <script type="module">
    import { StickerKit } from './sticker-kit.js';
    const kit = new StickerKit({ endpoint: 'http://127.0.0.1:8787/api/cutout', gradeRecipe: 'paper-muted' });
    const file = document.querySelector('#file');
    const add = document.querySelector('#add');
    const status = document.querySelector('#status');
    let selected;
    file.addEventListener('change', () => { selected = file.files[0]; add.disabled = !selected; status.textContent = selected ? selected.name : ''; });
    add.addEventListener('click', async () => {
      add.disabled = true; status.textContent = '正在识别主体…';
      try {
        const sticker = await kit.make(selected);
        kit.place(document.querySelector('#map'), sticker, { x: 50, y: 68, width: 34 });
        status.textContent = '已贴到地图';
      } catch (error) { status.textContent = error.message; }
      finally { add.disabled = false; }
    });
  </script>
</html>
