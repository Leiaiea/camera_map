<script>
const stage=document.querySelector('#stage'),topPaper=document.querySelector('#top'),bottomPaper=document.querySelector('#bottom'),edge=document.querySelector('#edge'),debug=[...document.querySelectorAll('.debug button')];const mapSnapshot=new URLSearchParams(location.search).get('mapSnapshot');if(mapSnapshot){const url=new URL(mapSnapshot,location.href).href;stage.style.setProperty('--map-snapshot',`url("${url.replaceAll('"','%22')}")`)}let mode='A',line,noise,reveal=1;
function createLine(){let p=[[0,0],[1,0]],r=.008;for(let n=0;n<2;n++){let q=[p[0]];for(let i=0;i<p.length-1;i++){let a=p[i],b=p[i+1];q.push([(a[0]+b[0])/2,(a[1]+b[1])/2+(Math.random()-.5)*r],b)}p=q;r*=.3}return p.map((v,i)=>i&&i<p.length-1?[v[0],Math.max(-.012,Math.min(.012,(p[i-1][1]+v[1]+p[i+1][1])/3))]:v)}
const poly=p=>'polygon('+p.map(v=>v[0].toFixed(2)+'px '+v[1].toFixed(2)+'px').join(',')+')',path=p=>'M '+p.map(v=>v.join(' ')).join(' L ');

function openFromLeft(){mode='B';stage.dataset.mode='B';reveal=0;topPaper.style.transition='none';bottomPaper.style.transition='none';const start=performance.now(),duration=620;function frame(now){const progress=Math.min(1,(now-start)/duration);reveal=1-Math.pow(1-progress,3);draw();if(progress<1)requestAnimationFrame(frame);else{reveal=1;draw();topPaper.style.transition='';bottomPaper.style.transition=''}}requestAnimationFrame(frame)}function setMode(next){let apply=()=>{mode=next;stage.dataset.mode=next;reveal=1;draw()};if(next==='B'&&mode==='A'){openFromLeft()}else if(next==='C'&&mode==='B'){stage.classList.add('is-tensing');setTimeout(()=>{stage.classList.remove('is-tensing');apply()},100)}else apply();debug.forEach(b=>b.classList.toggle('active',b.dataset.mode===next))}

const staticInput=document.querySelector('#input-sheet'),staticStatus=document.querySelector('#recording-status'),staticRecord=document.querySelector('.guide'),staticText=document.querySelector('.archive');

let listening=false,listenStarted=0,listenTimer=0,meterFrame=0,lastMeterSample=0,smoothedLevel=2;
const listeningTime=staticStatus.querySelector('.listening-time'),levelMeter=staticStatus.querySelector('.level-meter'),meterBars=Array.from({length:22},()=>{const bar=document.createElement('i');bar.className='meter-bar';levelMeter.append(bar);return bar});

const startListening=()=>{if(stage.dataset.mode==='A'||listening||staticRecord.classList.contains('has-recording'))return;listening=true;listenStarted=Date.now();lastMeterSample=0;smoothedLevel=2;meterHistory.fill(2);renderMeter();staticRecord.classList.add('is-recording');staticStatus.classList.add('is-visible');listenTimer=setInterval(()=>{const seconds=Math.min(60,Math.floor((Date.now()-listenStarted)/1000));listeningTime.textContent=clock(seconds);if(seconds>=60)finishListening()},250);meterFrame=requestAnimationFrame(drawMeter)};

const textArea=staticInput.querySelector('textarea');
const closeTextInput=save=>{const text=textArea.value.trim();if(save&&text){const trace=document.createElement('button');trace.type='button';trace.className='text-trace';trace.textContent=text;trace.setAttribute('aria-label','移除静态文字痕迹');memoryTraces.append(trace)}textArea.value='';staticInput.classList.remove('is-open');staticInput.setAttribute('aria-hidden','true');};

staticInput.addEventListener('click',event=>{if(event.target===staticInput||event.target.closest('[data-close]'))closeTextInput(false);if(event.target.closest('[data-save]'))closeTextInput(true)});
